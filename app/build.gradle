plugins { id 'com.android.application' }
android {
    namespace 'com.shazwan.idash'
    compileSdk 35
    defaultConfig {
        applicationId 'com.shazwan.idash'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
        testInstrumentationRunner 'com.shazwan.idash.SmokeChecks'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    buildTypes { release { minifyEnabled false } }
}
